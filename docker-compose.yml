services:
  blink-snap:
    image: cjedro/blink-snap:0.0.1
    pull_policy: always
    environment:
      BLINK_USERNAME: ${BLINK_USERNAME}
      BLINK_PASSWORD: ${BLINK_PASSWORD}
      CAMERA: ${CAMERA}
      INTERVAL: ${INTERVAL}
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./blink_session.json:/data/blink_session.json
      - ./captures:/data/captures
    restart: unless-stopped
